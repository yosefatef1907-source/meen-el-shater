<style>:root{--bg:#0a0618;--c1:#ff3cac;--c2:#2bd2ff;--c3:#ffd166;--ok:#2ee59d;--bad:#ff5470;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#f6f0ff;font-family:'Cairo','Noto Sans Arabic','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:linear-gradient(160deg,#1a0b3d,#0a0618 55%,#06182b)}
#bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 14s ease-in-out infinite}
#bg i:nth-child(1){width:60vmax;height:60vmax;background:#ff3cac;top:-25vmax;right:-20vmax}
#bg i:nth-child(2){width:55vmax;height:55vmax;background:#2bd2ff;bottom:-25vmax;left:-20vmax;animation-delay:-5s}
#bg i:nth-child(3){width:30vmax;height:30vmax;background:#7b4bff;top:35%;left:20%;animation-delay:-9s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,-3vmax) scale(1.1)}}
#root{position:relative;z-index:1;min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100dvh}
.logo{font-size:30px;font-weight:900;text-align:center;background:linear-gradient(90deg,var(--c1),var(--c3),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.sub{text-align:center;color:#cfc2ee;font-size:15px;margin-top:-8px}
.scr{display:flex;flex-direction:column;gap:14px;flex:1;animation:in .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.h{font-size:15px;font-weight:700;color:#cfc2ee;margin:0 0 10px}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:50px;border-radius:14px;border:2px solid #4c3a85;background:rgba(20,10,50,.7);color:#fff;padding:0 14px;font-size:18px;font-family:inherit;user-select:text;-webkit-user-select:text}
.inp:focus{outline:none;border-color:var(--c2)}
.btn{min-height:56px;border:0;border-radius:18px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--c1),#8a4bff 60%,#2b86c5);box-shadow:0 8px 28px rgba(255,60,172,.35);padding:0 20px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.sm{min-height:50px;font-size:16px;padding:0 18px}
.btn.ghost{background:transparent;border:2px solid #4c3a85;box-shadow:none;color:#d9ccf5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:15px;cursor:pointer;transition:all .15s}
.chip.on{border-color:var(--c2);background:rgba(43,210,255,.16);box-shadow:0 0 16px rgba(43,210,255,.3)}
.pl{border-color:var(--c1);background:rgba(255,60,172,.14)}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center;padding:0}
.hint{color:#a898c9;font-size:13px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;font-weight:700}
.score{color:var(--c3)}
.turn{align-items:center;justify-content:center;text-align:center;gap:18px}
.av{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 50px rgba(255,60,172,.55);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 70px rgba(43,210,255,.6)}}
.big{font-size:34px;font-weight:900}
.mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini span{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px}
.mini b{color:var(--c3)}
.qcat{display:inline-block;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,rgba(255,60,172,.3),rgba(43,210,255,.3));font-size:13px;font-weight:700}
.q{font-size:23px;line-height:1.6;font-weight:800;text-align:center;padding:20px 14px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--line);animation:in .4s both}
.ringw{display:flex;justify-content:center}
.ring{position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--c2);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring.low .fg{stroke:var(--bad)}.ring.low{animation:shake .5s infinite}
@keyframes shake{25%{transform:translateX(2px)}75%{transform:translateX(-2px)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.06);font-size:18px;font-weight:700;text-align:right;cursor:pointer;animation:in .4s both;transition:transform .12s,border-color .2s,background .2s}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:active{transform:scale(.98)}
.opt .l{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:900}
.opt.ok{border-color:var(--ok);background:rgba(46,229,157,.2);box-shadow:0 0 26px rgba(46,229,157,.5);animation:pop .5s}
.opt.bad{border-color:var(--bad);background:rgba(255,84,112,.2);animation:shake .4s}
.opt.off{opacity:.25;pointer-events:none}
.opt.dim{opacity:.55;pointer-events:none}
@keyframes pop{40%{transform:scale(1.04)}}
.life{display:flex;gap:8px;justify-content:center}
.res{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.res .t{font-size:28px;font-weight:900}
.res .pts{font-size:42px;font-weight:900;color:var(--c3);animation:pop .6s}
.fire{font-size:20px;font-weight:800;color:#ffb347}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:230px;margin-top:6px}
.pod div{flex:1;max-width:120px;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-weight:800;text-align:center;font-size:15px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.3,1.1) both}
.pod .n1{background:linear-gradient(180deg,#ffd166,#e59a00);height:100%;color:#2a1a00;animation-delay:.5s}
.pod .n2{background:linear-gradient(180deg,#d9e2ee,#8d9bb0);height:72%;color:#1b2430;animation-delay:.25s}
.pod .n3{background:linear-gradient(180deg,#e0a070,#a0612f);height:55%;color:#2b1608;animation-delay:0s}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.pod em{font-style:normal;font-size:30px}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.07)}
.lbr .nm{flex:1;font-weight:700}.lbr small{color:#b9aad8}.lbr b{color:var(--c3);font-size:18px}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
